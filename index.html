<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2b0f1b 0%, #14060c 60%, #090205 100%);
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(255, 77, 109, 0.25) 0%, rgba(255, 77, 109, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .message {
      position: relative;
      z-index: 10;
      color: #fff0f3;
      font-size: clamp(2rem, 6.5vw, 4.2rem);
      font-weight: 700;
      text-align: center;
      padding: 0 24px;
      letter-spacing: -0.02em;
      text-shadow: 0 0 25px rgba(255, 77, 109, 0.6), 0 4px 12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .message.beat {
      transform: scale(1.08);
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(14px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bg-heart {
      position: absolute;
      bottom: -30px;
      color: rgba(255, 117, 143, 0.22);
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }

    .burst-heart {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      font-size: 1.3rem;
      animation: burst 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes burst {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="message" id="msg">ben seni çok seviyom</div>

  <script>
    const msg = document.getElementById('msg');
    const heartChars = ['❤', '♥', '💕'];

    function spawnBgHeart() {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 16 + 12) + 'px';
      const duration = Math.random() * 6 + 7;
      heart.style.animationDuration = duration + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }

    setInterval(spawnBgHeart, 900);
    for (let i = 0; i < 6; i++) setTimeout(spawnBgHeart, i * 300);

    function triggerLove(x, y) {
      msg.classList.remove('beat');
      void msg.offsetWidth;
      msg.classList.add('beat');
      setTimeout(() => msg.classList.remove('beat'), 250);

        const b = document.createElement('div');
        b.className = 'burst-heart';
